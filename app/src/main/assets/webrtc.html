<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QuickDrop WebRTC Bridge</title>
  <script src="peerjs.min.js"></script>
</head>
<body>
<script>
  let peer = null;
  let currentConn = null;
  let myCode = "";
  let myId = "";
  let myNickname = "Android Phone";

  window.initWebRTC = function(code, nickname) {
    myCode = code;
    myId = "quickdrop-" + code;
    myNickname = nickname || "Android Phone";

    try {
      peer = new Peer(myId, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        if (window.AndroidBridge) {
          AndroidBridge.onCodeReady(myCode);
        }
      });

      peer.on('connection', (conn) => {
        setupConn(conn);
      });

      peer.on('error', (err) => {
        if (window.AndroidBridge) {
          AndroidBridge.onError(err.type || err.message || 'WebRTC error');
        }
      });
    } catch(e) {
      if (window.AndroidBridge) {
        AndroidBridge.onError('Init error: ' + e.message);
      }
    }
  };

  function setupConn(conn) {
    currentConn = conn;

    conn.on('open', () => {
      conn.send({
        type: 'hello',
        name: myNickname,
        deviceType: 'mobile',
        os: 'Android'
      });
      if (window.AndroidBridge) {
        AndroidBridge.onPeerConnected(
          conn.peer,
          conn.metadata?.name || 'Internet Device',
          conn.metadata?.deviceType || 'desktop'
        );
      }
    });

    conn.on('data', (data) => {
      if (!data || !data.type) return;

      if (data.type === 'hello') {
        conn.send({
          type: 'welcome',
          name: myNickname,
          deviceType: 'mobile'
        });
        if (window.AndroidBridge) {
          AndroidBridge.onPeerConnected(conn.peer, data.name || 'Internet Device', data.deviceType || 'desktop');
        }
      }

      if (data.type === 'welcome') {
        if (window.AndroidBridge) {
          AndroidBridge.onPeerConnected(conn.peer, data.name || 'Internet Device', data.deviceType || 'desktop');
        }
      }

      if (data.type === 'file-start') {
        if (window.AndroidBridge) {
          AndroidBridge.onFileStart(data.txId, data.name, data.size || 0, data.mime || 'application/octet-stream', conn.metadata?.name || 'Internet Device');
        }
      }

      if (data.type === 'file-chunk') {
        if (window.AndroidBridge) {
          let b64 = '';
          if (data.chunk instanceof ArrayBuffer) {
            let binary = '';
            let bytes = new Uint8Array(data.chunk);
            let len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            b64 = window.btoa(binary);
          } else if (typeof data.chunk === 'string') {
            b64 = data.chunk;
          }
          AndroidBridge.onFileChunk(data.txId, b64);
        }
      }

      if (data.type === 'file-done') {
        if (window.AndroidBridge) {
          AndroidBridge.onFileDone(data.txId);
        }
      }

      if (data.type === 'text') {
        if (window.AndroidBridge) {
          AndroidBridge.onText(data.text, conn.metadata?.name || 'Internet Device');
        }
      }
    });

    conn.on('close', () => {
      if (window.AndroidBridge) {
        AndroidBridge.onPeerDisconnected(conn.peer);
      }
      if (currentConn === conn) currentConn = null;
    });

    conn.on('error', () => {
      if (window.AndroidBridge) {
        AndroidBridge.onPeerDisconnected(conn.peer);
      }
      if (currentConn === conn) currentConn = null;
    });
  }

  window.connectToCode = function(code) {
    if (!peer) return;
    const clean = code.replace(/[^0-9]/g, '');
    const targetId = 'quickdrop-' + clean;
    const conn = peer.connect(targetId, {
      reliable: true,
      metadata: {
        name: myNickname,
        deviceType: 'mobile',
        os: 'Android'
      }
    });
    setupConn(conn);
  };

  window.sendFileStart = function(txId, name, size, mime) {
    if (currentConn && currentConn.open) {
      currentConn.send({
        type: 'file-start',
        txId: txId,
        name: name,
        size: size,
        mime: mime
      });
    }
  };

  window.sendFileChunk = function(txId, base64) {
    if (currentConn && currentConn.open) {
      let binary = window.atob(base64);
      let len = binary.length;
      let bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      currentConn.send({
        type: 'file-chunk',
        txId: txId,
        chunk: bytes.buffer
      });
    }
  };

  window.sendFileDone = function(txId, name) {
    if (currentConn && currentConn.open) {
      currentConn.send({
        type: 'file-done',
        txId: txId,
        name: name
      });
    }
  };

  window.sendTextMsg = function(text) {
    if (currentConn && currentConn.open) {
      currentConn.send({
        type: 'text',
        text: text
      });
    }
  };

  window.disconnectCurrent = function() {
    if (currentConn) {
      try { currentConn.close(); } catch(e) {}
      currentConn = null;
    }
  };
</script>
</body>
</html>
